name: "Add Resource: Training"
description: "Suggest a MySQL course, tutorial series, or certification program."
title: "Resource (Training): [name]"
labels: ["resource", "training"]
body:
  - type: input
    id: title
    attributes:
      label: "Name"
      placeholder: "e.g. MySQL for Developers"
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: "URL"
      placeholder: "https://..."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "1–2 sentences on what it covers and who it's for."
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: "Author or organization"
      placeholder: "e.g. Kedar Vaijanapurkar"
  - type: input
    id: date
    attributes:
      label: "Start date (optional)"
      description: "Only for a specific dated delivery — a workshop cohort, a bootcamp. Leave blank for self-paced or ongoing courses."
      placeholder: "e.g. 2027-06-15"
  - type: input
    id: date_end
    attributes:
      label: "End date (optional)"
      description: "Only if you set a start date above."
      placeholder: "e.g. 2027-06-17"
  - type: dropdown
    id: subcategory
    attributes:
      label: "Subcategory"
      options:
        - Courses
        - Workshops
        - Certifications
        - Academic Resources
        - Training Providers
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: "Additional tags (optional)"
      description: "Format, level, pricing, language — see the full list in RESOURCES.md. Comma-separated."
      placeholder: "Self-Paced, Beginner, Free"
