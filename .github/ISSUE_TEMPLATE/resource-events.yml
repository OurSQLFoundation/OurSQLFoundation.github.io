name: "Add Resource: Event"
description: "Suggest a MySQL-related conference, meetup, or community event."
title: "Resource (Events): [name]"
labels: ["resource", "events"]
body:
  - type: input
    id: title
    attributes:
      label: "Event name"
      placeholder: "e.g. MySQL Conference 2027"
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: "URL"
      placeholder: "https://..."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "1–2 sentences on what it is."
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: "Date"
      placeholder: "e.g. 2027-06-15"
  - type: input
    id: date_end
    attributes:
      label: "End date (optional)"
      description: "Only for a multi-day event."
      placeholder: "e.g. 2027-06-17"
  - type: dropdown
    id: format
    attributes:
      label: "Format"
      options:
        - in-person
        - online
        - hybrid
  - type: input
    id: location
    attributes:
      label: "City, Country"
      description: "Leave blank for an online-only event."
      placeholder: "e.g. Amsterdam, Netherlands"
  - type: input
    id: online_url
    attributes:
      label: "Online link (optional)"
      description: "Livestream or virtual-attendance URL, for an online or hybrid event."
      placeholder: "https://..."
  - type: input
    id: registration_url
    attributes:
      label: "Registration link (optional)"
      placeholder: "https://..."
  - type: input
    id: recording_url
    attributes:
      label: "Recording link (optional)"
      description: "Only once a recording actually exists — typically for a past event."
      placeholder: "https://..."
  - type: dropdown
    id: subcategory
    attributes:
      label: "Subcategory"
      options:
        - Foundation Events
        - Community Calls
        - Webinars
        - Meetups
        - Conferences
        - Partner & Member Events
        - Past Events & Recordings
    validations:
      required: true
  - type: dropdown
    id: organizer
    attributes:
      label: "Organizer"
      options:
        - OurSQL Foundation
        - Community
        - Member & Partner
  - type: input
    id: tags
    attributes:
      label: "Additional tags (optional)"
      description: "Comma-separated."
      placeholder: "Free"
