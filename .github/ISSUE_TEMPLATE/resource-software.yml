name: "Add Resource: Software"
description: "Suggest a software tool to add to the directory."
title: "Resource (Software): [name]"
labels: ["resource", "software"]
body:
  - type: input
    id: title
    attributes:
      label: "Name"
      placeholder: "e.g. MyTool"
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: "URL"
      placeholder: "https://..."
    validations:
      required: true
  - type: input
    id: github
    attributes:
      label: "Repository (optional)"
      description: "Only if there's a public GitHub repo separate from the URL above."
      placeholder: "https://github.com/owner/repo"
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "1–2 sentences on what it is and why it belongs here."
      placeholder: "A drop-in MySQL replacement that..."
    validations:
      required: true
  - type: dropdown
    id: subcategory
    attributes:
      label: "Subcategory"
      options:
        - Database Software
        - Monitoring & Observability
        - Backup & Recovery
        - Data Warehouse & Analytics
        - Replication & High Availability
        - Proxies & Traffic Management
        - Connectors & Drivers
        - Database Management & GUI
        - DevOps & Deployment
        - Schema Management & Migration
        - Testing & Benchmarking
        - Security
        - AI & Ecosystem Skills
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: "Additional tags (optional)"
      description: "Compatibility, deployment, license — see the full list in RESOURCES.md. Comma-separated."
      placeholder: "MySQL, Kubernetes, Open Source"
