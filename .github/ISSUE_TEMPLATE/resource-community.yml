name: "Add Resource: Community"
description: "Suggest a forum, blog, Slack workspace, or community space."
title: "Resource (Community): [name]"
labels: ["resource", "community"]
body:
  - type: input
    id: title
    attributes:
      label: "Name"
      placeholder: "e.g. My MySQL Blog"
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: "URL"
      placeholder: "https://..."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "1–2 sentences on what it is."
    validations:
      required: true
  - type: dropdown
    id: subcategory
    attributes:
      label: "Subcategory"
      options:
        - Forums
        - "Slack, Discord & IRC"
        - Mailing Lists
        - Reddit & Social
        - Blog Aggregators
        - Podcasts & Videos
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: "Additional tags (optional)"
      description: "Platform, language, access — see the full list in RESOURCES.md. Comma-separated."
      placeholder: "Forum, English, Open"
