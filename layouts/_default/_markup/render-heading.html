{{/* Same output as Hugo's default heading, plus a "#" link to the section on
     OurSQL Digest issues so each section can be linked to directly. */}}
<h{{ .Level }} id="{{ .Anchor }}"{{ range $k, $v := .Attributes }}{{ if ne $k "id" }} {{ $k }}="{{ $v }}"{{ end }}{{ end }}>{{ .Text | safeHTML }}{{ if .Page.Params.digest }}<a class="anchor-link" href="#{{ .Anchor }}" aria-label="Link to this section">#</a>{{ end }}</h{{ .Level }}>
